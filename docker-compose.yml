# Local development database only. Production compose (nginx, certbot, api,
# postgres) is a later infra step: docs/11 §7.1.
services:
  postgres:
    # Multi-arch (amd64 + arm64) PostGIS build; the official postgis/postgis
    # image has no native arm64 for Apple Silicon.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: realbite
      POSTGRES_PASSWORD: realbite
      POSTGRES_DB: realbite
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U realbite -d realbite']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
